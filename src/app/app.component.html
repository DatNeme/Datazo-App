<mat-toolbar class="app-toolbar">
  <a class="logo" [routerLink]="auth.isLoggedIn() ? '/' : null" [style.cursor]="auth.isLoggedIn() ? 'pointer' : 'default'" style="text-decoration: none;">
    🧠 <span *ngIf="router.url !== '/login'">{{ i18n.currentLang() === 'es' ? 'Datazo' : 'Oddly Specific' }}</span>
  </a>

  <!-- Botón de Ranking -->
  <button mat-button class="header-ranking-btn" [routerLink]="'/ranking'" *ngIf="auth.isLoggedIn()">
    <span class="trophy-icon">🏆</span> Ranking
  </button>

  <span class="spacer"></span>

  <!-- Toggle idioma: siempre visible -->
  <button class="icon-btn" (click)="toggleLanguage()" [title]="i18n.currentLang() === 'es' ? ('TOOLTIPS.SWITCH_LANG_EN' | translate) : ('TOOLTIPS.SWITCH_LANG_ES' | translate)">
    <span class="lang-label">{{ i18n.currentLang() === 'es' ? 'EN' : 'ES' }}</span>
  </button>

  <!-- Toggle tema: siempre visible -->
  <button class="icon-btn" (click)="toggleTheme()" [title]="themeService.isDarkMode() ? ('TOOLTIPS.LIGHT_MODE' | translate) : ('TOOLTIPS.DARK_MODE' | translate)">
    <svg *ngIf="themeService.isDarkMode()" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .38-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.38.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41-.38-.39-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41-.39-.38-1.03-.39-1.41 0z"/>
    </svg>
    <svg *ngIf="!themeService.isDarkMode()" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
    </svg>
  </button>

  <!-- Avatar del usuario: lleva al perfil -->
  <ng-container *ngIf="auth.isLoggedIn()">
    <button class="avatar-btn" [routerLink]="'/profile'" [title]="'TOOLTIPS.PROFILE' | translate">
      <img *ngIf="auth.photoURL" [src]="auth.photoURL" [alt]="userService.userProfile()?.displayName" class="avatar-img">
      <span *ngIf="!auth.photoURL" class="avatar-initials">{{ (userService.userProfile()?.displayName || 'U').charAt(0).toUpperCase() }}</span>
    </button>

    <!-- Botón de logout suelto a la derecha -->
    <button class="icon-btn logout-btn" (click)="logout()" [title]="'TOOLTIPS.LOGOUT' | translate">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
      </svg>
    </button>
  </ng-container>
</mat-toolbar>

<main class="content-area">
  <router-outlet></router-outlet>
</main>
